include:
  - ../tamagotchi_server/docker-compose.yaml

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    user: vscode
    command: sleep infinity
    volumes:
      - ..:/workspaces/nabrudno:cached
      - claude-code-config:/home/vscode/.claude
    environment:
      - SERVERPOD_CLOUD_TOKEN=${SERVERPOD_CLOUD_TOKEN:-}
      - GH_TOKEN=${TAMAGOTCHI_GITHUB_TOKEN:-}
    depends_on:
      - postgres

volumes:
  claude-code-config:
