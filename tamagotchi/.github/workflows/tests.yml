name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VERSION: '3.4.8'
      SERVERPOD_PASSWORD_database: 'CDm3BOYJ8Z4lhCj_Wvzum3UPoMHF2NVU'
      SERVERPOD_PASSWORD_redis: '9U_IkVlC_6M9-AvhxISKd_F_GZjbNoZi'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'

      - name: Start containers
        working-directory: tamagotchi_server
        run: docker compose up --quiet-pull --quiet-build --build -d

      - name: Install dependencies
        working-directory: tamagotchi_server
        run: dart pub get

      - name: Install Serverpod CLI
        working-directory: tamagotchi_server
        run: dart pub global activate serverpod_cli $VERSION

      - name: Run Serverpod generator
        working-directory: tamagotchi_server
        run: serverpod generate

      - name: Run tests
        working-directory: tamagotchi_server
        run: dart test

      - name: Stop containers
        if: always()
        working-directory: tamagotchi_server
        run: docker compose down -v
