name: tamagotchi_server
description: Starting point for a Serverpod server.
# version: 1.0.0
# homepage: https://www.example.com

environment:
  sdk: '^3.8.0'

resolution: workspace

dependencies:
  serverpod: 3.4.8
  serverpod_auth_idp_server: 3.4.8
  # HTTP client for the production verification-email path: an HTTPS POST to
  # EmailLabs' `new_sendmail` REST API over 443 (scloud blocks outbound SMTP, so
  # the SMTP `mailer` transport is dead on prod). Run-mode-gated in server.dart —
  # not used in `development`, which logs the code instead.
  http: ^1.6.0

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  mutation_test: ^1.8.0
  serverpod_test: 3.4.8
  test: ^1.25.5

serverpod:
  scripts:
    # Starts the server and applies migrations
    start: dart bin/main.dart --apply-migrations

    # Starts the server in the `e2e` identity for the patrol browser tests:
    # `serverpod run e2e`. Serverpod 3.x has no custom run mode, so this boots the
    # `test` run mode (tamagotchi_test DB, hermetic `test:` passwords → stub LLM)
    # and the TAMAGOTCHI_E2E flag makes server.dart's _e2eConfigOverride pin the
    # API to :8080 and stamp runMode `e2e` (fixed verification code, log-only
    # email). The Postgres sidecars are always up with the devcontainer — never
    # `docker compose up` for e2e.
    e2e: TAMAGOTCHI_E2E=true dart bin/main.dart --mode test --apply-migrations

    # Build the Flutter web app and copy it to the server's web directory.
    # Windows uses xcopy since flutter's --output flag doesn't work there.
    # See: https://github.com/flutter/flutter/issues/157886
    #
    # No --wasm: the experimental dart2wasm renderer compiles cleanly (the wasm
    # dry run even passes) but fails at runtime instantiation with
    # `LinkError: Import "dart2wasm" "_..." function import requires a callable`
    # on this Flutter 3.44 / Dart 3.12 toolchain. The stable dart2js renderer
    # (main.dart.js) works with all current deps; revisit --wasm if a later
    # toolchain resolves the instantiation skew.
    flutter_build:
      windows: >-
        (if exist web\app rmdir /S /Q web\app)
        & cd /D ..\tamagotchi_flutter
        && flutter build web --base-href /app/
        && xcopy /E /I /Y build\web ..\tamagotchi_server\web\app
      posix: |
        rm -rf web/app
        cd ../tamagotchi_flutter
        flutter build web --base-href /app/ --output ../tamagotchi_server/web/app
