name: Analyze

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          cache: true

      - name: Install dependencies
        working-directory: tamagotchi_server
        run: dart pub get

      - name: Analyze
        working-directory: tamagotchi_server
        # `flutter analyze`, not `dart analyze`: with the root riverpod_lint analyzer plugin,
        # `dart analyze` hangs indefinitely (the plugin resolves outside the workspace lock, and
        # every riverpod_lint compatible with this SDK's analysis_server_plugin — 3.1.8+ — stalls
        # it). `flutter analyze` runs the same analyzer and analysis_options without the hang.
        run: flutter analyze --fatal-infos
