name: Flutter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Install dependencies
        working-directory: tamagotchi/tamagotchi_flutter
        run: flutter pub get

      - name: Analyze
        working-directory: tamagotchi/tamagotchi_flutter
        run: flutter analyze

      - name: Check formatting
        working-directory: tamagotchi/tamagotchi_flutter
        run: dart format --set-exit-if-changed .

      - name: Run tests
        working-directory: tamagotchi/tamagotchi_flutter
        run: flutter test
