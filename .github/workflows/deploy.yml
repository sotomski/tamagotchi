name: Deploy to Serverpod Cloud

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      SERVERPOD_CLOUD_TOKEN: ${{ secrets.SERVERPOD_CLOUD_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Install Serverpod CLIs
        # serverpod_cli is pinned to the project's Serverpod package version (codegen compatibility).
        # serverpod_cloud_cli is pinned to the exact version Serverpod Cloud currently force-requires
        # server-side. It used to be unpinned to "always grab latest", but unpinned `activate` silently
        # resolved to a STALE version: the latest CLI's transitive deps pull Serverpod betas, which
        # pub avoids under an `any` constraint, so it backtracked to an older CLI the server then
        # rejected (deploy run 28663805860 got 0.32.0 while the server required 0.33.0). Pinning forces
        # pub to resolve the required version's full graph. Bump this together with the devcontainer's
        # SERVERPOD_CLOUD_CLI_VERSION when the server force-requires a newer CLI.
        run: |
          dart pub global activate serverpod_cli 3.4.8
          dart pub global activate serverpod_cloud_cli 0.33.0

      - name: Build Flutter web bundle into server's web/app/
        working-directory: tamagotchi_server
        run: serverpod run flutter_build

      - name: Deploy
        working-directory: tamagotchi_server
        # --no-analytics: skip the first-run analytics consent prompt (blocks non-interactive CI)
        # --yes: auto-accept confirmation prompts in non-interactive environments
        run: scloud --no-analytics --yes deploy
